name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # false: rapid pushes queue; the previous run finishes instead of being cancelled mid-suite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GIT_TERMINAL_PROMPT: 0
      DEBIAN_FRONTEND: noninteractive
    strategy:
      matrix:
        zsh-version: ['default']
      fail-fast: true

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          # zpwrCommandExists tests must not assume tools outside this list (plus
          # coreutils/util-linux from the Ubuntu image). Optional packages like
          # lsof, jq, openssl, sudo, pagers, procps (pgrep/pkill), file, strings are not guaranteed.
          sudo apt-get install -y --no-install-recommends \
            zsh vim perl python3 curl git \
            netcat-openbsd net-tools bc screen rsync zip unzip openssh-client iputils-ping

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install stryke
        # INTERIM PIN — remove once strykelang publishes a release that builds.
        # strykelang 0.17.46 (published 2026-07-29, currently the crates.io
        # latest) cannot be installed on this runner by either resolution path:
        #   * with --locked: 0.17.46 bumped its direct dep to `fusevm = "0.15.0"`
        #     but kept `zshrs = "0.12.3"`, and zshrs 0.12.3 requires
        #     `fusevm ^0.14.0`. Those are separate 0.x majors, so Cargo cannot
        #     unify them and the published Cargo.lock carries TWO fusevm
        #     packages (0.14.17 and 0.15.0). Both export the same 51
        #     `extern "C"` `fusevm_jit_*`/`fusevm_aot_*` symbols, which collide
        #     under strykelang's `[profile.release] lto = "fat"`. Observed in
        #     run 30736164453: `failed to load bitcode of module
        #     "fusevm-d5d7584c955bb84e.…rcgu.o"` → `failed to compile
        #     `strykelang v0.17.46``, exit 101 after ~18 min.
        #   * without --locked: resolution floats zshrs to 0.12.28, whose
        #     `ZshCond` gained a `ModCond` variant (zshrs-0.12.28
        #     src/extensions/zsh_ast.rs:316). strykelang 0.17.46's `map_zcond`
        #     (strykelang/zsh_convert.rs:496) matches only Not/And/Or/Unary/
        #     Binary/Regex with no wildcard arm → error[E0004].
        # 0.17.45 keeps a single fusevm (0.14.7) and is the newest release that
        # builds. It installed cleanly with --locked on this same ubuntu-latest
        # image in run 30161742924 ("Installed package `strykelang v0.17.45`"),
        # where the full suite then passed — so this pin restores a known-good
        # graph rather than papering over a zpwr defect.
        # --locked stays so the pin resolves that exact verified graph.
        # Unpin as soon as a strykelang release lands whose graph holds one
        # fusevm major (needs strykelang to bump zshrs alongside fusevm).
        run: |
          cargo install --locked strykelang --version 0.17.45
          command -v stryke

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: zpwr
          fetch-depth: 1

      - name: Set terminal size variables
        run: |
          echo "TERM=xterm" >> "$GITHUB_ENV"
          echo "COLUMNS=120" >> "$GITHUB_ENV"
          echo "LINES=40" >> "$GITHUB_ENV"

      - name: Set up ZPWR environment
        run: |
          cp -a zpwr ~/.zpwr
          cd ~/.zpwr
          mkdir -p .bin
          echo "ZPWR=$HOME/.zpwr" >> "$GITHUB_ENV"
          echo "ZPWR_SCRIPTS=$HOME/.zpwr/scripts" >> "$GITHUB_ENV"

      - name: Create directories expected by tests
        run: |
          mkdir -p "$HOME/Desktop" "$HOME/Documents" "$HOME/Downloads" "$HOME/forkedRepos"
          mkdir -p "$HOME/.zpwr/local/.temp" "$HOME/.zpwr/local/.cache" "$HOME/.zpwr/local/zcompcache"
          mkdir -p "$HOME/.zinit/plugins/fzf" "$HOME/.zinit/plugins/MenkeTechnologies---fzf"

      - name: Install test tools
        run: |
          cd ~/.zpwr
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 \
            https://raw.githubusercontent.com/molovo/revolver/refs/heads/master/revolver > .bin/revolver
          chmod u+x .bin/revolver
          echo "$HOME/.zpwr/.bin" >> "$GITHUB_PATH"

      - name: Cache zunit binary
        id: cache-zunit
        uses: actions/cache@v5
        with:
          path: ~/.zpwr/.cache/zunit-bin
          key: zunit-${{ runner.os }}-v1-0.8.x-${{ hashFiles('zpwr/.github/workflows/ci.yml') }}
          restore-keys: |
            zunit-${{ runner.os }}-v1-0.8.x-
            zunit-${{ runner.os }}-v1-

      - name: Build zunit
        if: steps.cache-zunit.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.zpwr/.cache/zunit-bin
          cd ~/.zpwr
          git clone --depth 1 https://github.com/MenkeTechnologies/zunit zunit-src
          cd zunit-src
          ./build.zsh
          command cp zunit ~/.zpwr/.cache/zunit-bin/zunit
          chmod +x ~/.zpwr/.cache/zunit-bin/zunit

      - name: Add zunit to PATH
        run: echo "$HOME/.zpwr/.cache/zunit-bin" >> "$GITHUB_PATH"

      - name: Ensure zunit executable bit
        run: chmod +x "$HOME/.zpwr/.cache/zunit-bin/zunit"

      - name: Verify zunit
        run: |
          test -x "$HOME/.zpwr/.cache/zunit-bin/zunit"
          command -v zunit
          zunit --version

      - name: Run tests
        run: |
          cd ~/.zpwr
          zunit --verbose tests/*.zsh
